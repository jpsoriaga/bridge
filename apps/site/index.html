<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridge: let the chat edit your local project</title>
    <meta
      name="description"
      content="Bridge lets the ChatGPT web chat edit a project on your computer, even on the Free plan. Every change shows as a diff you review and apply, with undo. Free, open source, and it stays on your machine."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bridge" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Bridge: let the chat edit your local project" />
    <meta
      property="og:description"
      content="Review every change the ChatGPT web chat suggests as a diff, then apply it to your project with one click. Free, open source, works on the Free plan."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Bridge logo and a diff card: the chat's change to a file, with Reject and Apply."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bridge: let the chat edit your local project" />
    <meta
      name="twitter:description"
      content="Review every change the ChatGPT web chat suggests as a diff, then apply it to your project with one click."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <!-- Sets data-theme before the first paint, so a saved theme doesn't flash. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
