name: Release

# A version tag builds every installer and the extension zip, checks them, and attaches
# them to a DRAFT release. Publishing is done by hand (RELEASE.md). A beta tag
# (vX.Y.Z-beta.N) makes a pre-release that is never marked Latest, with only the Load
# unpacked extension zip (scripts/release-flags.mjs, scripts/release-extension.mjs).
on:
  push:
    tags: ['v*']

# Read-only by default. Only the last job may write, to create the draft release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    # The full CI suite (format, lint, typecheck, build, coverage, audit, e2e). No secrets.
    # A job that calls a workflow can't set timeout-minutes; ci.yml's jobs set their own.
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Every package carries the tag's version, and CHANGELOG.md has a section for it.
      - run: node scripts/version.mjs check "$GITHUB_REF_NAME"
      - run: node scripts/changelog.mjs "$GITHUB_REF_NAME" > /dev/null
      - run: node scripts/release-flags.mjs "$GITHUB_REF_NAME"

  package:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Signing secrets reach these steps only, as environment variables electron-builder
      # reads. Nothing prints them. Without them, the build is unsigned (with a warning).
      - name: Package for macOS
        if: matrix.platform == 'mac'
        run: pnpm --filter @bridge/desktop package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Package for Windows
        if: matrix.platform == 'win'
        run: pnpm --filter @bridge/desktop package:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: pnpm --filter @bridge/desktop package:linux

      # Fails on any fuse that isn't as scripts/fuses.cjs sets it.
      - name: Verify fuses
        working-directory: apps/desktop
        run: |
          case "${{ matrix.platform }}" in
            mac) apps="dist/mac-arm64/Bridge.app dist/mac/Bridge.app" ;;
            win) apps="dist/win-unpacked/Bridge.exe" ;;
            linux) apps="dist/linux-unpacked/bridge" ;;
          esac
          for app in $apps; do node scripts/verify-fuses.cjs "$app"; done
      # Fuses again, and app.asar holds only the built app and production dependencies.
      - name: Check package contents
        run: pnpm --filter @bridge/desktop check:package

      - name: Smoke test (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: |
          # The x64 build runs under Rosetta on the arm64 runner.
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          node scripts/smoke.mjs dist/mac-arm64/Bridge.app dist/mac/Bridge.app
      - name: Smoke test (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: node scripts/smoke.mjs dist/win-unpacked/Bridge.exe
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: |
          # Electron's sandbox needs unprivileged user namespaces, which Ubuntu's AppArmor
          # restricts by default on runners. The AppImage runs extracted (no FUSE on runners).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/smoke.mjs dist/Bridge-*-linux-x86_64.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          # Installers, plus latest*.yml for the app's "Check for updates".
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac-*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/latest*.yml

  extension:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The store zip (minified, no source maps, no manifest key) and the Load unpacked zip
      # (the same, with the key); refuses to zip otherwise. A beta gets the unpacked one only.
      - run: pnpm build:extension:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          if-no-files-found: error
          path: release/bridge-extension-*.zip

  release:
    needs: [package, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that may write: it creates the draft release. No signing secrets here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/release-flags.mjs --intro "$GITHUB_REF_NAME" > notes.md
          node scripts/changelog.mjs "$GITHUB_REF_NAME" >> notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nothing for vX.Y.Z; --prerelease --latest=false for vX.Y.Z-beta.N.
          flags=$(node scripts/release-flags.mjs "$GITHUB_REF_NAME")
          # shellcheck disable=SC2086 # one flag per word, on purpose
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Bridge ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            $flags
